services:
  - type: web
    name: medtime-quremed-cloud
    runtime: node
    plan: free
    rootDir: medtime-cloud
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medtime-quremed-db
          property: connectionString

databases:
  - name: medtime-quremed-db
    plan: free
    databaseName: medtime
    user: medtime
