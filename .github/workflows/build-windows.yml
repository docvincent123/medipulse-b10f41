name: Build QureMED Studio Windows

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript and Vite build
        run: npm run build

      - name: Build Windows packages
        run: npx electron-builder --win nsis portable

      - name: Upload QureMED Studio EXE
        uses: actions/upload-artifact@v4
        with:
          name: QureMED-Studio-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
