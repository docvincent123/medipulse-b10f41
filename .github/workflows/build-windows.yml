name: Build QureMed Studio Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows packages
        run: npm run dist:win

      - name: Upload QureMed Studio EXE
        uses: actions/upload-artifact@v4
        with:
          name: QureMed-Studio-Windows
          path: release/*.exe
          if-no-files-found: error
